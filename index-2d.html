}
function temporadaHoy() {

}

function ruta(c0, r0, c1, r1) {            // BFS 4 direcciones -> lista de baldosas

    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(key(nc, nr))) continue;
      if (!pasa[nr][nc] && !(nc === c1 && nr === r1)) continue;

}

function tecla(when, vol) {

  s.buffer = sonido.click; s.playbackRate.value = 0.75 + Math.random() * 0.5;
  f.type = 'bandpass'; f.frequency.value = 1700 + Math.random() * 1600; f.Q.value = 1.1; g.gain.value = vol;
  s.connect(f).connect(g).connect(sonido.master); s.start(when);
}
function programarTeclas() {               // ráfagas de tecleo; más seguidas si hay agentes trabajando
  if (!sonido.on || !sonido.ctx) return;
  const c = sonido.ctx, trab = AGENTES.filter(a => a.estado === 'trabajando').length;
  let w = c.currentTime + 0.05; const n = 3 + Math.floor(Math.random() * 9);
  for (let i = 0; i < n; i++) { tecla(w, 0.25 + Math.random() * 0.2); w += 0.07 + Math.random() * 0.15; }
  const pausa = trab ? 0.5 + Math.random() * 1.6 : 1.8 + Math.random() * 4;
  sonido.timer = setTimeout(programarTeclas, (w - c.currentTime + pausa) * 1000);
}
function pintarBocina(on) {
  const t = on ? 'Silenciar sonido ambiente' : 'Activar sonido ambiente';
  btnSon.setAttribute('aria-pressed', on ? 'true' : 'false'); btnSon.title = t; btnSon.setAttribute('aria-label', t);
}
function ponerSonido(on) {
  pintarBocina(on); sonido.on = on; clearTimeout(sonido.timer);
  if (on) {
    if (!sonido.ctx && !iniciarAudio()) { pintarBocina(false); sonido.on = false; return; }
    const c = sonido.ctx, g = sonido.master.gain; if (c.state !== 'running') c.resume();
    g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value, c.currentTime); g.linearRampToValueAtTime(VOL_AMB, c.currentTime + 1.5);
    programarTeclas();
  } else if (sonido.ctx) {
    const c = sonido.ctx, g = sonido.master.gain;
    g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value, c.currentTime); g.linearRampToValueAtTime(0, c.currentTime + 0.4);
    setTimeout(() => { if (!sonido.on) c.suspend(); }, 500);
  }
}
btnSon.addEventListener('click', () => {
  const on = btnSon.getAttribute('aria-pressed') !== 'true';
  lsSet(LS_SONIDO, on ? '1' : '0'); ponerSonido(on);
});
document.addEventListener('visibilitychange', () => {   // pausa en pestañas ocultas
  if (!sonido.ctx || !sonido.on) return;
  if (document.hidden) { clearTimeout(sonido.timer); sonido.ctx.suspend(); } else { sonido.ctx.resume(); programarTeclas(); }
});
if (!(window.AudioContext || window.webkitAudioContext)) btnSon.hidden = true;
else if (lsGet(LS_SONIDO) === '1') {        // recordado: arranca con el primer toque (el navegador no deja autoplay)
  pintarBocina(true);
  const arrancar = e => {
    if (e.target && e.target.closest && e.target.closest('#sonido')) return;
    removeEventListener('pointerdown', arrancar, true); removeEventListener('keydown', arrancar, true);
    if (btnSon.getAttribute('aria-pressed') === 'true' && !sonido.on) ponerSonido(true);
  };
  addEventListener('pointerdown', arrancar, true); addEventListener('keydown', arrancar, true);
}

/* ---------------- Efectos de sonido (EFECTOS_SONIDO) — WebAudio procedural, sin archivos ----------------
   Usan el mismo botón 🔊 y la misma mezcla que el sonido ambiente: solo suenan con el sonido activado por el usuario.
   ding = respuesta nueva en respuestas.json · campanita = aviso / fin de proceso · pasos (máx. ~4/s) · taza y cafetera del barista. */
const efecto = (() => {
  const ult = {}, ok = () => sonido.on && sonido.ctx && sonido.ctx.state === 'running' && !document.hidden;
  const libre = (k, ms) => { const n = performance.now(); if (ult[k] && n - ult[k] < ms) return false; ult[k] = n; return true; };
  let ruidoB = null;
  const ruido = c => { if (!ruidoB) { const n = Math.floor(c.sampleRate * 1.6); ruidoB = c.createBuffer(1, n, c.sampleRate); const d = ruidoB.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } return ruidoB; };
  function tono(f, t0, dur, vol, tipo) {
    const c = sonido.ctx, o = c.createOscillator(), g = c.createGain(); o.type = tipo || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(sonido.master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function ding() {                       // respuesta nueva: "ding" limpio de dos parciales
    if (!ok() || !libre('ding', 1200)) return; const t = sonido.ctx.currentTime + 0.02;
    tono(1046.5, t, 1.1, 0.55); tono(2093, t, 0.6, 0.12); tono(1568, t + 0.12, 0.9, 0.3);
  }
  function campana() {                    // aviso / fin de proceso: campanita (parciales inarmónicos de campana)
    if (!ok() || !libre('campana', 2500)) return; const t = sonido.ctx.currentTime + 0.02;
    for (const [i, f] of [[0, 1318.5], [1, 1760]]) { const t0 = t + i * 0.18; tono(f, t0, 1.6, 0.32); tono(f * 2.76, t0, 0.5, 0.06); tono(f * 5.4, t0, 0.18, 0.03); }
  }
  function paso(vol) {                    // pasito suave: golpe de ruido muy grave y corto
    if (!ok() || vol < 0.05 || !libre('paso', 220)) return;
    const c = sonido.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + 0.01;
    s.buffer = ruido(c); f.type = 'lowpass'; f.frequency.value = 260 + Math.random() * 120;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9 * vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    s.connect(f).connect(g).connect(sonido.master); s.start(t, Math.random() * 1.4, 0.12);
  }
  function taza(vol = 1) {                // taza sobre el plato: dos "clinks" agudos
    if (!ok() || vol < 0.05 || !libre('taza', 1500)) return; const t = sonido.ctx.currentTime + 0.02;
    tono(2637, t, 0.22, 0.16 * vol); tono(3951, t, 0.12, 0.06 * vol); tono(2489, t + 0.13, 0.18, 0.1 * vol); tono(3729, t + 0.13, 0.1, 0.04 * vol);
  }
  function cafetera(vol = 1) {            // cafetera: vapor (ruido agudo filtrado) + burbujeo grave
    if (!ok() || vol < 0.05 || !libre('cafetera', 5000)) return;
    const c = sonido.ctx, t = c.currentTime + 0.02;
    const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); s.buffer = ruido(c);
    bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.7;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22 * vol, t + 0.25); g.gain.linearRampToValueAtTime(0.16 * vol, t + 1.2); g.gain.linearRampToValueAtTime(0.0001, t + 1.6);
    s.connect(bp).connect(g).connect(sonido.master); s.start(t, 0, 1.6);
    const s2 = c.createBufferSource(), lp = c.createBiquadFilter(), g2 = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(); s2.buffer = ruido(c);
    lp.type = 'lowpass'; lp.frequency.value = 320; g2.gain.value = 0; lfo.frequency.value = 9; lg.gain.value = 0.35 * vol;
    lfo.connect(lg).connect(g2.gain); s2.connect(lp).connect(g2).connect(sonido.master);
    s2.start(t + 0.2, 0, 1.3); lfo.start(t + 0.2); lfo.stop(t + 1.5);
  }
  // Vigilantes: respuestas.json, avisos (eventos.json) y confeti (fin de proceso masivo)
  let rN = null, rT = '', avN = 0, confN = null, baLleva = false, baFase = '';
  setInterval(() => {
    if (respCargadas) { const n = respuestas.length, m = maxTs(respuestas); if (rN !== null && (m > rT || n > rN)) ding(); rN = n; rT = m; }
    if (sinLeer > avN) campana(); avN = sinLeer;
    const cf = (window.oficina && window.oficina.confetis) || 0; if (confN !== null && cf > confN) campana(); confN = cf;
  }, 1000);
  // Pasos de los agentes y barista (cada 100 ms). Volumen por distancia si la página define volPos(x, y).
  const vol = (x, y) => (typeof volPos === 'function' ? volPos(x, y) : 0.55);
  setInterval(() => {
    if (!ok()) return;
    for (const p of [...gente, barista]) {
      if (p.modo !== 'caminando') { p._paso = null; continue; }
      const k = Math.floor((p.dist || 0) / 10);                  // un paso cada ~10 px recorridos (como la animación)
      if (p._paso != null && k !== p._paso) paso(vol(p.x, p.y) * 0.6);
      p._paso = k;
    }
    const b = barista;
    if (b.lleva && !baLleva) cafetera(vol(b.x, b.y));              // preparó el café en la barra
    if (b.fase === 'sirve' && baFase !== 'sirve') taza(vol(b.x, b.y));   // deja la taza en la mesa
    baLleva = b.lleva; baFase = b.fase;
  }, 100);
  return { ding, campana, paso, taza, cafetera };
})();

/* ---------------- ⏳ Orden pendiente + sondeo rápido ----------------
   Tras enviar una orden (enviarOrden -> ordenarHermes) se marca «pendiente»: burbuja de HERMES «Trabajando en ello…»
   en el chat y globo en la escena, hasta que llega una respuesta nueva de ese agente en respuestas.json (o 10 min).
   Mientras haya pendiente (máx. 3 min) respuestas/estado se leen de la API de GitHub (sin caché de Pages) cada 5 s;
   la API sin token permite 60 peticiones/h por IP, por eso solo se usa en esa ventana. Si falla -> ruta relativa. */
const LS_PEND = 'oficina-pendientes', PEND_MAX = 10 * 60 * 1000, RAPIDO_MS = 5000, RAPIDO_MAX = 10 * 60 * 1000;
const REPO_API = 'https://api.github.com/repos/Jasmee779-cmd/oficina-floower/contents/', REPO_RAMA = 'main';
const REPO_RAW = 'https://raw.githubusercontent.com/Jasmee779-cmd/oficina-floower/' + REPO_RAMA + '/';   // fresco con ?t= (sin caché), sin límite 60/h
const esTrabajando = t => /^\s*(⏳\s*)?trabajando en ello/i.test(String(t || ''));   // el «Trabajando en ello…» de HERMES no cierra la orden
let pendientes = (() => { try { const v = JSON.parse(lsGet(LS_PEND) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch (e) { return {}; } })();
let respCargadas = false, rapidoHasta = 0, rapidoTimer = null, nRapido = 0, apiPausa = 0, ultimoApi = 0;
const firmaResp = id => { let u = null; for (const r of respuestas) if (r && r.id === id && r.texto && !esTrabajando(r.texto) && (!u || String(r.ts) >= String(u.ts))) u = r; return u ? String(u.ts) + '|' + u.texto : ''; };
const maxTs = arr => arr.reduce((m, r) => (r && r.ts && String(r.ts) > m ? String(r.ts) : m), '');
function guardarPend() { lsSet(LS_PEND, Object.keys(pendientes).length ? JSON.stringify(pendientes) : null); }
function marcarPendiente(id) {
  pendientes[id] = { desde: Date.now(), u: respCargadas ? firmaResp(id) : null }; guardarPend();
  if (panelId === id) pintarMensajes(); activarRapido(Date.now());
}
function revisarPendientes() {
  let cambio = false; const ahora = Date.now();
  for (const id of Object.keys(pendientes)) {
    const p = pendientes[id];
    if (!p || ahora - p.desde > PEND_MAX) { delete pendientes[id]; cambio = true; continue; }
    if (!respCargadas) continue;
    const f = firmaResp(id);
    if (p.u == null) { p.u = f; cambio = true; } else if (f !== p.u) { delete pendientes[id]; cambio = true; }   // llegó respuesta nueva
  }
  if (cambio) { guardarPend(); if (panelId) pintarMensajes(); }
}
const _ordenarHermes = ordenarHermes;        // enviarOrden llama a ordenarHermes(id) solo cuando el envío salió bien
ordenarHermes = function (id) { marcarPendiente(id); return _ordenarHermes(id); };
function activarRapido(desde) {
  rapidoHasta = Math.max(rapidoHasta, desde + RAPIDO_MAX);
  if (Date.now() < rapidoHasta && !rapidoTimer && location.protocol !== 'file:') { rapidoTimer = setInterval(sondeoRapido, RAPIDO_MS); setTimeout(sondeoRapido, 1200); }
}
async function sondeoRapido() {
  if (Date.now() > rapidoHasta || !Object.keys(pendientes).length) { clearInterval(rapidoTimer); rapidoTimer = null; return; }
  nRapido++; await cargarRespuestas(true);
  if (nRapido % 3 === 1) await cargarEstadoExterno(true);     // estado cada ~15 s (cuida el límite de la API)
}
async function leerArchivo(f, rapido) {      // texto del archivo: raw de GitHub / API (si rapido) o la copia de Pages
  if (rapido) {
    try {
      const r = await fetch(REPO_RAW + f + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { ultimoApi = Date.now(); return { txt: await r.text(), api: true }; }
    } catch (e) { /* sigue con la API */ }
  }
  if (rapido && Date.now() > apiPausa) {
    try {
      const r = await fetch(REPO_API + f + '?ref=' + REPO_RAMA + '&t=' + Date.now(), { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw' } });
      if (r.ok) { ultimoApi = Date.now(); return { txt: await r.text(), api: true }; }
      apiPausa = Date.now() + (r.status === 403 || r.status === 429 ? 15 * 60 * 1000 : 60 * 1000);   // límite agotado / error
    } catch (e) { apiPausa = Date.now() + 60 * 1000; }
  }
  const r = await fetch(f + '?t=' + Date.now(), { cache: 'no-store' });
  return r.ok ? { txt: await r.text(), api: false } : null;
}
const apiReciente = () => Date.now() - ultimoApi < 10 * 60 * 1000;   // Pages puede ir hasta ~10 min atrasado

const POLL_MS = 10000;
let firmaEstado = '';
async function cargarEstadoExterno(rapido) {
  if (location.protocol === 'file:') return;
  try {
    const res = await leerArchivo('estado.json', rapido === true); if (!res) return;
    const txt = res.txt; if (txt === firmaEstado) return; firmaEstado = txt;
    const d = JSON.parse(txt), viejo = !res.api && apiReciente();
    (Array.isArray(d) ? d : (d.agentes || [])).forEach(x => {
      if (!x) return;
      if (viejo) { const a = AGENTES.find(y => y.id === x.id); if (a && a.ts && x.ts && String(x.ts) < String(a.ts)) return; }   // no retroceder
      actualizar(x.id, x.estado, x.tarea, x.ts);
    });
  } catch (e) { /* sin estado.json: se usan los datos de arriba */ }
}
// Respuestas de HERMES/agentes para el chat: "respuestas.json" = [{ "id", "de", "texto", "ts" }]
async function cargarRespuestas(rapido) {
  if (location.protocol === 'file:') return;
  try {
    const res = await leerArchivo('respuestas.json', rapido === true); if (!res) return;
    const d = JSON.parse(res.txt); if (!Array.isArray(d)) return;
    if (!res.api && apiReciente() && maxTs(d) < maxTs(respuestas)) return;   // copia de Pages más vieja que la de la API
    respuestas = d; respCargadas = true; revisarPendientes(); if (panelId) pintarMensajes();
  } catch (e) { /* sin respuestas.json: no se muestra nada */ }
}

addEventListener('resize', ajustar);
dibujarFondo(); tic(); resumen(); ajustar(); cargarEstadoExterno(); cargarRespuestas();
setInterval(tic, 1000); setInterval(cargarEstadoExterno, POLL_MS); setInterval(cargarRespuestas, POLL_MS);
revisarBloqueados(); setInterval(revisarBloqueados, 1000);
setInterval(revisarPendientes, 15000);                       // ⏳ caducan a los 10 min
for (const id in pendientes) if (pendientes[id] && pendientes[id].desde) activarRapido(pendientes[id].desde);   // tras recargar
encajarVista();
cargarDatosDia(); setInterval(cargarDatosDia, POLL_MS);      // panel del día (datos-dia.json)
cargarHistorico(); setInterval(cargarHistorico, POLL_MS * 6);  // gráfico semanal (historico.json, cada 60 s)
cargarEventos(); setInterval(cargarEventos, POLL_MS);          // 🔔 avisos de fin de proceso (eventos.json)
colocarTarjetas();
cargarClima(); setInterval(cargarClima, CLIMA_MS);            // clima real de Lima (open-meteo, cada 10 min)
setInterval(pintarClima, 60000);                               // ícono día/noche
requestAnimationFrame(cuadroAnim);
})();
