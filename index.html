<script>
(() => {
'use strict';
/* ---------------- Configuración visual (posiciones y looks) ---------------- */
const W = 1200, H = 684, U = 4;           // lienzo lógico y tamaño de "pixel"
const ESTADOS = {
  trabajando: { txt: 'TRABAJANDO', color: '#3bb273', defecto: 'Trabajando…' },

};
const F_TAREA = "600 13px 'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif";
const F_CHIP  = "800 10px 'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif";
const F_NOMBRE= "800 12px 'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif";
const F_ROL   = "600 11px 'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif";
const BORDE = '#5a4a42';

const FILA1 = 378, FILA2 = 600;
const LOOK = {
  hermes:    { x: 600,  y: 150,  jefe: true, piel:'#f6d2b0', pelo:'corto',  colorPelo:'#6b4a3a', camisa:'#8e6bd1', acc:'alas', corbata:'#f2c14e', color:'#7c5cc4', item:'trofeo' },
  ali:       { x: 150,  y: FILA1, piel:'#f1c7a3', pelo:'corto',  colorPelo:'#4a3226', camisa:'#ff9f5a', color:'#e9822f', item:'cajas' },
  ali2:      { x: 450,  y: FILA1, piel:'#e9b994', pelo:'cola',   colorPelo:'#2e2430', camisa:'#ffb37a', color:'#df7d45', item:'banderin' },
  tienda:    { x: 750,  y: FILA1, piel:'#f6d2b0', pelo:'largo',  colorPelo:'#a0522d', camisa:'#f59ab8', color:'#d9668f', item:'florero' },
  cierre:    { x: 1050, y: FILA1, piel:'#d9a47c', pelo:'corto',  colorPelo:'#231c1c', camisa:'#5fcf8a', color:'#2f9e5c', acc:'audifonos', item:'celular' },
  marketing: { x: 150,  y: FILA2, piel:'#f6d2b0', pelo:'mono',   colorPelo:'#e8b84a', camisa:'#c983e0', color:'#9c55bb', acc:'boina', colorAcc:'#e2557a', item:'camara' },
  contable:  { x: 450,  y: FILA2, piel:'#f1c7a3', pelo:'corto',  colorPelo:'#a3a3ae', camisa:'#6f9be0', color:'#4775c4', acc:'lentes', item:'calculadora' },
  recluta:   { x: 750,  y: FILA2, piel:'#c98e66', pelo:'rizado', colorPelo:'#3b2a20', camisa:'#4fc3b5', color:'#24968a', item:'portapapeles' },
  disksaver: { x: 1050, y: FILA2, robot: true, piel:'#c9d3df', camisa:'#9fb3c8', color:'#5f7894', item:'basurero' },
};

/* ---------------- Lienzo ---------------- */
const cv = document.getElementById('oficina');
const ctx = cv.getContext('2d');
const fondo = document.createElement('canvas');
let g = ctx, escala = 1, dpr = 1;

function ajustar() {
  const hdr = document.querySelector('header').offsetHeight, ftr = document.querySelector('footer').offsetHeight;
  const disp = Math.max(200, innerHeight - hdr - ftr - 18);
  escala = Math.min((innerWidth - 20) / W, disp / H);
  dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.round(W * escala) + 'px';
  cv.style.height = Math.round(H * escala) + 'px';
  cv.width = Math.round(W * escala * dpr); cv.height = Math.round(H * escala * dpr);
  fondo.width = cv.width; fondo.height = cv.height;
  const fc = fondo.getContext('2d');
  fc.setTransform(escala * dpr, 0, 0, escala * dpr, 0, 0);
  g = fc; dibujarFondo(); g = ctx;
}

/* ---------------- Primitivas pixel ---------------- */
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function S(ox, oy, gx, gy, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(ox + gx * U), Math.round(oy + gy * U), w * U, h * U); }
function caja(x, y, w, h, relleno, borde) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  R(x + 4, y, w - 8, h, borde); R(x, y + 4, w, h - 8, borde); R(x + 2, y + 2, w - 4, h - 4, borde);
  R(x + 4, y + 2, w - 8, h - 4, relleno); R(x + 2, y + 4, w - 4, h - 8, relleno);
}
function texto(t, x, y, font, color, align = 'center') {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(t, x, y);
}
function ancho(t, font) { g.font = font; return g.measureText(t).width; }
function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
function envolver(t, font, max, maxLineas = 2) {
  const pal = t.split(/\s+/), lineas = []; let act = '';
  for (const p of pal) {
    const prueba = act ? act + ' ' + p : p;
    if (ancho(prueba, font) <= max || !act) act = prueba; else { lineas.push(act); act = p; }
  }
  if (act) lineas.push(act);
  if (lineas.length > maxLineas) {
    const l = lineas.slice(0, maxLineas); let u = l[maxLineas - 1];
    while (ancho(u + '…', font) > max && u.length) u = u.slice(0, -1);
    l[maxLineas - 1] = u + '…'; return l;
  }
  return lineas;
}

/* ---------------- Decoración ---------------- */
function planta(x, y, grande) {
  const k = grande ? 1.35 : 1;
  R(x - 11 * k, y - 18 * k, 22 * k, 18 * k, '#d9826a'); R(x - 13 * k, y - 21 * k, 26 * k, 5 * k, '#eb9c83');
  R(x - 11 * k, y - 4, 22 * k, 4, '#c26f58');
  const h = [[-3, -46, 6, 26, '#58ad6a'], [-15, -38, 11, 7, '#6cc27e'], [4, -42, 12, 7, '#6cc27e'], [-12, -32, 6, 12, '#4f9c60'],
             [7, -36, 6, 14, '#4f9c60'], [-7, -52, 6, 10, '#7fd090'], [2, -55, 5, 12, '#6cc27e'], [-20, -44, 8, 6, '#7fd090'], [12, -50, 7, 6, '#7fd090']];
  for (const [dx, dy, w, hh, c] of h) R(x + dx * k, y + dy * k, w * k, hh * k, c);
}
function alfombra(x, y, w, h, c1, c2) {
  caja(x, y, w, h, c1, c2);
  for (let i = x + 14; i < x + w - 14; i += 28) R(i, y + 6, 14, 3, c2), R(i + 14, y + h - 9, 14, 3, c2);
}
function vidrio(x, y, w, h) {
  R(x, y, w, h, 'rgba(160,210,238,.55)'); g.strokeStyle = '#9fb8cc'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
  g.fillStyle = 'rgba(255,255,255,.7)';
  if (w > h) for (let i = x + 20; i < x + w - 10; i += 46) g.fillRect(i, y + 2, 10, 2);
  else for (let i = y + 20; i < y + h - 10; i += 46) g.fillRect(x + 2, i, 2, 10);
}
function dibujarFondo() {
  // piso de madera
  R(0, 0, W, H, '#f3dfc5');
  for (let y = 70, f = 0; y < H; y += 28, f++) {
    R(0, y, W, 2, '#e8cdab');
    for (let x = (f % 2 ? 0 : 90); x < W; x += 180) R(x, y, 2, 28, '#e8cdab');
  }
  // pared
  R(0, 0, W, 70, '#fde6d6'); R(0, 0, W, 6, '#f4cdb8');
  for (let y = 14; y < 60; y += 16) for (let x = (y % 32 ? 8 : 0); x < W; x += 16) R(x, y, 3, 3, '#f9d7c3');
  R(0, 60, W, 10, '#e8b89f'); R(0, 60, W, 2, '#f4cdb8');
  // alfombras de las filas
  alfombra(16, FILA1 - 92, W - 32, 140, '#d3eee2', '#b4dcca');
  alfombra(16, FILA2 - 92, W - 32, 140, '#fadbe1', '#f1bfca');
  // oficina del jefe
  R(420, 70, 360, 172, '#ebe3f8');
  for (let y = 70; y < 242; y += 20) for (let x = 420 + ((y / 20) % 2) * 20; x < 780; x += 40) R(x, y, 20, 20, '#e2d8f3');
  alfombra(470, 92, 260, 128, '#f6e7b8', '#ead28a');
  // estante en la pared del jefe
  R(436, 12, 64, 58, '#b98b63'); R(440, 16, 56, 50, '#8e6542');
  const libros = ['#f28b82', '#fbbc04', '#81c995', '#8ab4f8', '#c58af9', '#f7a8c8'];
  for (let s = 0; s < 2; s++) { R(440, 39 + s * 25, 56, 3, '#b98b63'); for (let i = 0; i < 6; i++) R(444 + i * 8, 22 + s * 25 + (i % 3), 6, 17 - (i % 3), libros[(i + s * 2) % 6]); }
  planta(758, 120, false);
  // paredes de vidrio
  vidrio(420, 70, 8, 172); vidrio(772, 70, 8, 172); vidrio(420, 236, 146, 8); vidrio(634, 236, 146, 8);
  R(564, 228, 4, 18, '#8aa3b8'); R(632, 228, 4, 18, '#8aa3b8');
  caja(574, 248, 52, 12, '#e7a9bd', '#cf8aa1');
  // letrero "Dirección"
  caja(668, 214, 84, 18, '#fffaf0', '#c9a24a'); texto('DIRECCIÓN', 710, 223, F_CHIP, '#9a7420');

  // --- zona café (izquierda) ---
  caja(78, 8, 128, 50, '#cfe9f8', '#a7c0d0'); // ventana marco (cielo animado luego)
  R(24, 72, 184, 22, '#f5ebdf'); R(24, 72, 184, 3, '#fff7ee'); R(24, 94, 184, 26, '#cda37b'); R(24, 94, 184, 2, '#b5865c');
  for (let i = 0; i < 4; i++) { R(30 + i * 45, 99, 40, 17, '#c2966c'); R(46 + i * 45, 106, 8, 3, '#8e6542'); }
  // cafetera
  R(36, 34, 40, 44, '#5d6272'); R(40, 38, 32, 10, '#3d4150'); R(44, 41, 10, 4, '#7fe0c0'); R(46, 52, 20, 18, '#2f3240');
  R(54, 52, 4, 6, '#c0c4cc'); R(49, 64, 14, 10, '#ffffff'); R(62, 66, 4, 5, '#ffffff'); R(32, 76, 48, 4, '#4a4e5c');
  // tazas y frutero
  R(92, 66, 10, 10, '#f7a8c8'); R(102, 69, 3, 5, '#f7a8c8'); R(110, 66, 10, 10, '#8ab4f8'); R(120, 69, 3, 5, '#8ab4f8');
  R(140, 70, 34, 8, '#e0b98f'); R(144, 62, 8, 8, '#f28b82'); R(152, 60, 8, 8, '#fbbc04'); R(160, 63, 8, 8, '#81c995');
  // dispensador de agua
  R(226, 26, 28, 30, 'rgba(130,195,240,.85)'); R(230, 30, 6, 20, 'rgba(255,255,255,.6)'); R(232, 22, 16, 6, '#7fb2d6');
  R(222, 56, 36, 54, '#eef2f6'); R(222, 56, 36, 3, '#ffffff'); R(232, 68, 6, 6, '#e5484d'); R(242, 68, 6, 6, '#4a9be8'); R(226, 106, 28, 6, '#cfd8e0');
  // letrero neón
  caja(276, 12, 128, 40, '#5b3d4a', '#3e2832');
  g.save(); g.shadowColor = '#ff8fb8'; g.shadowBlur = 10; texto('FLOOWER.PE', 352, 33, "900 15px 'Segoe UI',Arial,'DejaVu Sans',sans-serif", '#ffc2d8'); g.restore();
  R(286, 26, 4, 4, '#ffd54f'); R(282, 26, 4, 4, '#ff8fb8'); R(290, 26, 4, 4, '#ff8fb8'); R(286, 22, 4, 4, '#ff8fb8'); R(286, 30, 4, 4, '#ff8fb8');
  // mesita redonda con florero
  R(78, 196, 16, 10, '#f29fb0'); R(176, 196, 16, 10, '#f29fb0');
  caja(98, 168, 74, 30, '#fff3e0', '#d9b48c'); R(130, 198, 10, 18, '#d9b48c'); R(118, 214, 34, 4, '#c79f76');
  R(130, 160, 10, 12, '#9fd3e8'); R(126, 150, 6, 6, '#f48fb1'); R(136, 148, 6, 6, '#ffd54f'); R(131, 154, 6, 6, '#e86a92'); R(134, 156, 2, 6, '#58ad6a');
  R(108, 176, 12, 8, '#ffffff'); R(150, 178, 10, 8, '#ffffff');
  planta(320, 132, true); planta(392, 222, false);

  // --- zona descanso (derecha) ---
  caja(806, 8, 184, 54, '#ffffff', '#b9a596');
  texto('Metas de hoy', 898, 20, F_CHIP, '#e86a92');
  const metas = ['Masivos Aliclik', 'Cierres WhatsApp', 'Post Instagram'];
  metas.forEach((m, i) => { R(818 + i * 0, 28 + i * 10, 7, 7, '#81c995'); texto(m, 830, 32 + i * 10, "700 9px 'Segoe UI',Arial,'DejaVu Sans',sans-serif", '#6d5a50', 'left'); });
  R(950, 46, 30, 4, '#f28b82'); R(950, 52, 22, 4, '#8ab4f8');
  // sofá
  R(826, 76, 160, 28, '#f29fb0'); R(826, 76, 160, 4, '#f7b9c6'); R(826, 102, 160, 26, '#f7b6c3'); R(818, 88, 16, 44, '#ec8ea2'); R(978, 88, 16, 44, '#ec8ea2');
  R(840, 104, 64, 4, '#fbd0d9'); R(908, 104, 64, 4, '#fbd0d9'); R(834, 128, 6, 8, '#b5865c'); R(972, 128, 6, 8, '#b5865c');
  R(848, 84, 22, 18, '#ffe08a'); R(942, 84, 22, 18, '#9fd3e8');
  // gatito durmiendo
  R(892, 94, 28, 12, '#f2a65a'); R(914, 88, 12, 12, '#f2a65a'); R(914, 85, 4, 4, '#f2a65a'); R(922, 85, 4, 4, '#f2a65a');
  R(917, 94, 3, 1, '#5a4a42'); R(922, 94, 3, 1, '#5a4a42'); R(888, 100, 8, 4, '#e08e45'); R(898, 96, 4, 8, '#e08e45'); R(906, 96, 4, 8, '#e08e45');
  // mesita de centro
  caja(860, 150, 92, 26, '#fff3e0', '#d9b48c'); R(870, 156, 22, 14, '#8ab4f8'); R(874, 158, 22, 14, '#f7a8c8'); R(920, 154, 10, 12, '#ffffff'); R(930, 157, 3, 5, '#ffffff');
  // librero
  R(1028, 12, 144, 104, '#b98b63'); R(1034, 18, 132, 92, '#8e6542');
  for (let s = 0; s < 3; s++) {
    R(1034, 46 + s * 31, 132, 4, '#b98b63');
    for (let i = 0; i < 14; i++) { if (i === 9 && s === 1) { planta(1112, 77, false); i += 2; continue; } R(1038 + i * 9, 24 + s * 31 + (i % 4), 7, 22 - (i % 4), libros[(i * 5 + s) % 6]); }
  }
  planta(808, 222, false); planta(1176, 226, true);
  planta(26, H - 6, true); planta(W - 26, H - 6, true);
}

/* ---------------- Escritorio, monitor, objetos ---------------- */
function escritorio(cx, cy, half) {
  g.fillStyle = 'rgba(120,80,50,.16)'; g.fillRect(cx - half + 6, cy + 40, half * 2, 6);
  R(cx - half, cy - 15, half * 2, 37, '#ebc79f'); R(cx - half, cy - 15, half * 2, 3, '#f6dcbc');
  R(cx - half, cy + 22, half * 2, 18, '#c99a6e'); R(cx - half, cy + 22, half * 2, 2, '#b5865c');
  R(cx - half + 10, cy + 27, 34, 9, '#b5865c'); R(cx - half + 24, cy + 30, 6, 2, '#8e6542');
  R(cx + half - 44, cy + 27, 34, 9, '#b5865c'); R(cx + half - 30, cy + 30, 6, 2, '#8e6542');
}
function silla(ox, oy, color) {
  R(ox - 6, oy + 34, 68, 40, color); R(ox - 2, oy + 30, 60, 6, color); R(ox - 2, oy + 34, 60, 3, 'rgba(255,255,255,.25)');
}
function monitor(cx, cy, estado, t, fase) {
  R(cx + 40, cy - 18, 8, 8, '#8a8f9c'); R(cx + 30, cy - 11, 28, 4, '#7a7f8c');
  R(cx + 20, cy - 54, 48, 38, '#4a4f5c'); R(cx + 20, cy - 54, 48, 3, '#626878');
  const sx = cx + 23, sy = cy - 50, sw = 42, sh = 30;

    let ocultar = jefeFuera || (jefe.modo === 'ordenando' && jefe.objetivo && jefe.objetivo.id === a.id);
    if (!ocultar) globos.push([cx - 10, oy - 15, e.txt, e.color, cap(a.tarea) || e.defecto]);
    if (a.estado === 'bloqueado' && !jefeFuera) alertas.push([ox + 66, oy + 2]);
    etiqueta(a, L, cx, cy + 42);
  }
  for (const gl of globos) globo(...gl);
  for (const al of alertas) alerta(al[0], al[1], t);

  // Hermes caminando encima de todo
  if (jefe.modo !== 'sentado' && jefe.objetivo) {
    const Lh = LOOK.hermes;
    let x, y, paso = 0, senal = false;
    if (jefe.modo === 'ordenando') { [x, y] = jefe.ruta[jefe.ruta.length - 1]; senal = true; }
    else {
      const d = Math.min(jefe.largo, (t - jefe.inicio) * VEL);
      [x, y] = puntoEn(jefe.ruta, jefe.modo === 'ida' ? d : jefe.largo - d);
      paso = 1 + Math.floor(d / 16) % 2;
    }
    caminante(Lh, Math.round(x), Math.round(y), paso, senal);
    if (jefe.modo === 'ordenando') {
      const k = t - jefe.inicio, Lo = LOOK[jefe.objetivo.id];
      if (k < 1.8) globo(x, y - 94, null, null, '¡Nueva orden para ti!');
      else globo(Lo.x - 10, Lo.y - 82, null, null, '¡Entendido, jefe!');
    }
  }
  requestAnimationFrame(cuadro);
}

/* ---------------- Reloj (hora de Lima) y resumen ---------------- */
const fmtHora = new Intl.DateTimeFormat('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const fmtFecha = new Intl.DateTimeFormat('es-PE', { timeZone: 'America/Lima', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function tic() {
  const ahora = new Date();
  const partes = Object.fromEntries(fmtHora.formatToParts(ahora).map(p => [p.type, p.value]));
  horaLima = { h: +partes.hour % 24, m: +partes.minute, s: +partes.second };
  document.getElementById('hora').textContent = `${String(horaLima.h).padStart(2, '0')}:${partes.minute}:${partes.second}`;
  document.getElementById('fecha').textContent = 'Lima · ' + cap(fmtFecha.format(ahora));
}
function resumen() {
  const c = { trabajando: 0, libre: 0, bloqueado: 0 };
  AGENTES.forEach(a => { if (c[a.estado] !== undefined) c[a.estado]++; });
  document.getElementById('resumen').textContent =
    `${c.trabajando} trabajando · ${c.libre} libre${c.libre === 1 ? '' : 's'} · ${c.bloqueado} bloqueado${c.bloqueado === 1 ? '' : 's'}`;
}

/* ---------------- API para actualizar en vivo ---------------- */
function actualizar(id, estado, tarea) {
  const a = AGENTES.find(x => x.id === id); if (!a) return false;
  if (estado && ESTADOS[estado]) a.estado = estado;
  if (tarea !== undefined) a.tarea = tarea;
  resumen(); return true;
}
window.oficina = { actualizar, agentes: AGENTES };
// Opcional: si la página se sirve por http(s) y existe "estado.json" junto a este archivo,
// se lee cada 30 s. Formato: [{ "id": "ali", "estado": "trabajando", "tarea": "..." }, ...]
async function cargarEstadoExterno() {
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('estado.json', { cache: 'no-store' }); if (!r.ok) return;
    const d = await r.json(); (Array.isArray(d) ? d : (d.agentes || [])).forEach(x => actualizar(x.id, x.estado, x.tarea));
  } catch (e) { /* sin estado.json: se usan los datos de arriba */ }
}

addEventListener('resize', ajustar);
ajustar(); tic(); resumen(); cargarEstadoExterno();
setInterval(tic, 1000); setInterval(cargarEstadoExterno, 30000);
requestAnimationFrame(cuadro);
})();
</script>
