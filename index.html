<script>
(() => {
'use strict';
/* =====================================================================
   MINIVERSO FLOOWER.PE — todo se dibuja con código en un canvas pixel art.
   Mundo lógico: 42 x 26 baldosas de 16 px (672 x 416 px) dividido en cuartos por área; se escala.
   ===================================================================== */
const TS = 16, COLS = 42, ROWS = 26, MW = COLS * TS, MH = ROWS * TS;
/* Plano por CUARTOS (42 x 26 baldosas):
   filas 0-1   paredes de los cuartos de arriba
   filas 2-10  MARKETING (0-9) | VENTAS (11-21) | SALA DE HERMES (23-32) | FINANZAS (34-41)
   fila  11    muro sur delgado con puertas
   filas 12-13 PASILLO común (conecta todas las puertas)
   filas 14-15 paredes de los cuartos de abajo (con puertas)
   filas 16-25 ADMINISTRATIVA (0-15) | LIMPIEZA (17-22) | CAFETERÍA (24-41)
   A = pared   B = pared sala del jefe   V = muro vertical   S = muro sur delgado
   . = madera / suelo   b = alfombra jefe   k = cafetería   h = pasillo   d = puerta */
const MAPA = [

  'hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh',
  'AAAAAAAddAAAAAAAVAAAAddVAAAAdddAAAAAAAAAAA',
  'AAAAAAAddAAAAAAAVAAAAddVAAAAdddAAAAAAAAAAA',
  '................V......Vkkkkkkkkkkkkkkkkkk',
  '................V......Vkkkkkkkkkkkkkkkkkk',
  '................V......Vkkkkkkkkkkkkkkkkkk',
  '................V......Vkkkkkkkkkkkkkkkkkk',
  '................V......Vkkkkkkkkkkkkkkkkkk',
  '................V......Vkkkkkkkkkkkkkkkkkk',

/* Puestos: c,r = baldosa izquierda del escritorio (2 de ancho).
   tipo 'A' = de espaldas frente al monitor (silla al sur); 'B' y 'J' = de frente (silla al norte). */
const PUESTOS = {
  marketing: { c: 4,  r: 5,  tipo: 'B', item: 'camara' },       // MARKETING
  recluta:   { c: 13, r: 5,  tipo: 'B', item: 'carpeta' },      // VENTAS

for (const id in PUESTOS) {               // asiento (pies del personaje sentado)
  const p = PUESTOS[id], fila = p.tipo === 'A' ? p.r + 1 : p.r - 1;
  p.sc = p.c; p.sr = fila; p.x = (p.c + 1) * TS; p.y = fila * TS + 12;
}
// sitios de la cafetería [col, fila, hacia dónde mira]
const CAFE = [[25, 21, 'der'], [28, 21, 'izq'], [30, 21, 'der'], [33, 21, 'izq'], [35, 21, 'der'], [38, 21, 'izq'], [34, 18, 'arriba'], [37, 18, 'arriba']];

const LAMPARAS = [[0, 10], [11, 10], [23, 8], [41, 10], [0, 21]];       // baldosas con lámpara de pie

const LUCES_PASILLO = [40, 120, 200, 280, 360, 440, 520, 600];

/* ---------------- Rejilla caminable ---------------- */
const pasa = MAPA.map(f => [...f].map(ch => '.bdkh'.includes(ch)));
function bloquear(c, r, w = 1, h = 1) { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) if (pasa[y]) pasa[y][x] = false; }
for (const id in PUESTOS) bloquear(PUESTOS[id].c, PUESTOS[id].r, 2, 1);
// MARKETING: plantas, cámara, aro de luz, sofá, caballete, planta
bloquear(0, 2); bloquear(9, 2); bloquear(1, 3); bloquear(8, 3); bloquear(1, 9, 3, 1); bloquear(8, 9); bloquear(0, 10);
// VENTAS: plantas, mesa de celulares, dispensador
bloquear(11, 2); bloquear(21, 2); bloquear(12, 9, 2, 1); bloquear(21, 9);
// SALA DE HERMES: librero, planta, sillón, sillas de visita, planta
bloquear(23, 2, 2, 1); bloquear(32, 2); bloquear(23, 5, 1, 2); bloquear(26, 8); bloquear(29, 8); bloquear(32, 9);
// FINANZAS: archivadores, planta, mesa de caja, caja fuerte, planta
bloquear(34, 2, 2, 1); bloquear(41, 2); bloquear(34, 8, 2, 1); bloquear(41, 8); bloquear(41, 10);
// PASILLO: plantas en los extremos
bloquear(0, 12); bloquear(41, 12);
// ADMINISTRATIVA: estantes, palé de cajas, mesa de embalaje, plantas
bloquear(0, 16, 3, 1); bloquear(13, 16, 3, 1); bloquear(13, 21, 2, 2); bloquear(4, 23, 4, 1); bloquear(0, 25); bloquear(15, 25);
// LIMPIEZA: rack, cono, carrito, tachos
bloquear(17, 16); bloquear(22, 21); bloquear(17, 23); bloquear(21, 24, 2, 1);
// CAFETERÍA: barra, refri, plantas, mesas, sofá
for (const [c, r] of LAMPARAS) bloquear(c, r);
bloquear(BARRA.c, BARRA.r, BARRA.w, 1); bloquear(41, 16); bloquear(24, 16); bloquear(24, 25);

function ruta(c0, r0, c1, r1) {            // BFS 4 direcciones -> lista de baldosas
  const key = (c, r) => r * COLS + c, prev = new Map([[key(c0, r0), -1]]), q = [[c0, r0]];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === c1 && r === r1) break;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(key(nc, nr))) continue;
      if (!pasa[nr][nc] && !(nc === c1 && nr === r1)) continue;
      prev.set(key(nc, nr), key(c, r)); q.push([nc, nr]);
    }
  }
  const out = []; let k = key(c1, r1);
  if (!prev.has(k)) return [];
  while (k !== -1) { out.unshift([k % COLS, Math.floor(k / COLS)]); k = prev.get(k); }
  return out;
}

  const c = sonido.ctx, trab = AGENTES.filter(a => a.estado === 'trabajando').length;
  let w = c.currentTime + 0.05; const n = 3 + Math.floor(Math.random() * 9);
  for (let i = 0; i < n; i++) { tecla(w, 0.25 + Math.random() * 0.2); w += 0.07 + Math.random() * 0.15; }
  const pausa = trab ? 0.5 + Math.random() * 1.6 : 1.8 + Math.random() * 4;
  sonido.timer = setTimeout(programarTeclas, (w - c.currentTime + pausa) * 1000);
}
function pintarBocina(on) {
  const t = on ? 'Silenciar sonido ambiente' : 'Activar sonido ambiente';
  btnSon.setAttribute('aria-pressed', on ? 'true' : 'false'); btnSon.title = t; btnSon.setAttribute('aria-label', t);
}
function ponerSonido(on) {
  pintarBocina(on); sonido.on = on; clearTimeout(sonido.timer);
  if (on) {
    if (!sonido.ctx && !iniciarAudio()) { pintarBocina(false); sonido.on = false; return; }
    const c = sonido.ctx, g = sonido.master.gain; if (c.state !== 'running') c.resume();
    g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value, c.currentTime); g.linearRampToValueAtTime(VOL_AMB, c.currentTime + 1.5);
    programarTeclas();
  } else if (sonido.ctx) {
    const c = sonido.ctx, g = sonido.master.gain;
    g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value, c.currentTime); g.linearRampToValueAtTime(0, c.currentTime + 0.4);
    setTimeout(() => { if (!sonido.on) c.suspend(); }, 500);
  }
}
btnSon.addEventListener('click', () => {
  const on = btnSon.getAttribute('aria-pressed') !== 'true';
  lsSet(LS_SONIDO, on ? '1' : '0'); ponerSonido(on);
});
document.addEventListener('visibilitychange', () => {   // pausa en pestañas ocultas
  if (!sonido.ctx || !sonido.on) return;
  if (document.hidden) { clearTimeout(sonido.timer); sonido.ctx.suspend(); } else { sonido.ctx.resume(); programarTeclas(); }
});
if (!(window.AudioContext || window.webkitAudioContext)) btnSon.hidden = true;
else if (lsGet(LS_SONIDO) === '1') {        // recordado: arranca con el primer toque (el navegador no deja autoplay)
  pintarBocina(true);
  const arrancar = e => {
    if (e.target && e.target.closest && e.target.closest('#sonido')) return;
    removeEventListener('pointerdown', arrancar, true); removeEventListener('keydown', arrancar, true);
    if (btnSon.getAttribute('aria-pressed') === 'true' && !sonido.on) ponerSonido(true);
  };
  addEventListener('pointerdown', arrancar, true); addEventListener('keydown', arrancar, true);
}

const POLL_MS = 10000;
let firmaEstado = '';
async function cargarEstadoExterno() {
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('estado.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const txt = await r.text(); if (txt === firmaEstado) return; firmaEstado = txt;
    const d = JSON.parse(txt);
    (Array.isArray(d) ? d : (d.agentes || [])).forEach(x => x && actualizar(x.id, x.estado, x.tarea, x.ts));
  } catch (e) { /* sin estado.json: se usan los datos de arriba */ }
}
// Respuestas de HERMES/agentes para el chat: "respuestas.json" = [{ "id", "de", "texto", "ts" }]
async function cargarRespuestas() {
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('respuestas.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const d = await r.json(); if (!Array.isArray(d)) return;
    respuestas = d; if (panelId) pintarMensajes();
  } catch (e) { /* sin respuestas.json: no se muestra nada */ }
}

addEventListener('resize', ajustar);
dibujarFondo(); tic(); resumen(); ajustar(); cargarEstadoExterno(); cargarRespuestas();
setInterval(tic, 1000); setInterval(cargarEstadoExterno, POLL_MS); setInterval(cargarRespuestas, POLL_MS);
revisarBloqueados(); setInterval(revisarBloqueados, 1000);
requestAnimationFrame(cuadroAnim);
})();
