/* =====================================================================
   DATOS DE LOS AGENTES  —  edita SOLO esta lista para actualizar la oficina
   ---------------------------------------------------------------------
   estado : 'trabajando' | 'libre' | 'bloqueado'
   tarea  : texto corto que sale en el globito ('' = texto por defecto)
   id     : no lo cambies (une al agente con su escritorio y su look)
   También puedes cambiarlo en vivo desde la consola del navegador:
     oficina.actualizar('cierre', 'trabajando', 'cerrando venta #123')
   ===================================================================== */
const AGENTES = [
  { id: 'hermes',    nombre: 'HERMES',           rol: 'Jefe · coordina a todos',        estado: 'trabajando', tarea: 'coordinando' },
  { id: 'ali',       nombre: 'AGENTE ALI',       rol: 'Aliclik · masivos y entregas',   estado: 'libre',      tarea: 'masivos 06/10 subidos 30/30' },
  { id: 'ali2',      nombre: 'AGENTE ALI 2',     rol: 'Aliclik · va primero',           estado: 'libre',      tarea: '' },
  { id: 'tienda',    nombre: 'AGENTE TIENDA',    rol: 'CRM Flower',                     estado: 'libre',      tarea: 'Flower 05/10 cerrado' },
  { id: 'cierre',    nombre: 'AGENTE CIERRE',    rol: 'Cierra ventas por WhatsApp',     estado: 'libre',      tarea: '' },
  { id: 'marketing', nombre: 'AGENTE MARKETING', rol: 'Contenido Instagram FLOOWER.PE', estado: 'libre',      tarea: '' },
  { id: 'contable',  nombre: 'AGENTE CONTABLE',  rol: 'Contabilidad',                   estado: 'libre',      tarea: '' },
  { id: 'recluta',   nombre: 'WhatsApp Recluta', rol: 'Reclutamiento',                  estado: 'libre',      tarea: '' },
  { id: 'disksaver', nombre: 'Disk Saver',       rol: 'Limpieza del disco',             estado: 'libre',      tarea: '' },
];
/* Webhook de Slack CIFRADO (AES-GCM + PBKDF2-SHA256 600000 iter.). Sin la clave no sirve para nada.
   RELLENAR con encrypt-webhook.js  (node /workspace/oficina-estado/encrypt-webhook.js) — no editar a mano. */
const CIFRADO_WEBHOOK = { salt: '', iv: '', ct: '' }; // RELLENAR con encrypt-webhook.js

<style>

  *{box-sizing:border-box}

<script>
(() => {
'use strict';
/* =====================================================================
   MINIVERSO FLOOWER.PE — todo se dibuja con código en un canvas pixel art.
   Mundo lógico: 28 x 15 baldosas de 16 px (448 x 240 px) que se escala.
   ===================================================================== */
const TS = 16, COLS = 28, ROWS = 15, MW = COLS * TS, MH = ROWS * TS;
//  A = pared oficina   B = pared sala del jefe   V = muro vertical
//  . = madera   b = alfombra jefe   d = puerta   k = cocina
const MAPA = [
  'AAAAAAAAAAAAAAAAAAABBBBBBBBB',
  'AAAAAAAAAAAAAAAAAAABBBBBBBBB',
  '...................Vbbbbbbbb',
  '...................Vbbbbbbbb',
  '...................Vbbbbbbbb',
  '...................Vbbbbbbbb',
  '...................Vbbbbbbbb',
  '...................Vbbbbbbbb',
  '...................VdBBBBBBB',
  '...................kkkkkkkkk',
  '...................kkkkkkkkk',
  '...................kkkkkkkkk',
  '...................kkkkkkkkk',
  '...................kkkkkkkkk',
  '...................kkkkkkkkk',
];
const ESTADOS = {
  trabajando: { txt: 'Trabajando', color: '#3bb273', defecto: 'Trabajando…' },
  libre:      { txt: 'Libre',      color: '#4a9be8', defecto: 'Disponible, esperando órdenes' },
  bloqueado:  { txt: 'Bloqueado',  color: '#e5484d', defecto: '¡Necesito ayuda!' },
};
/* Puestos: c,r = baldosa izquierda del escritorio (2 de ancho).
   tipo 'A' = de espaldas frente al monitor (silla al sur); 'B' y 'J' = de frente (silla al norte). */
const PUESTOS = {
  ali:       { c: 1,  r: 2, tipo: 'A', item: 'cajas' },
  ali2:      { c: 5,  r: 2, tipo: 'A', item: 'banderin' },
  tienda:    { c: 9,  r: 2, tipo: 'A', item: 'flores' },
  cierre:    { c: 13, r: 2, tipo: 'A', item: 'celular' },
  marketing: { c: 1,  r: 8, tipo: 'B', item: 'camara' },
  contable:  { c: 5,  r: 8, tipo: 'B', item: 'calculadora' },
  recluta:   { c: 9,  r: 8, tipo: 'B', item: 'carpeta' },
  disksaver: { c: 13, r: 8, tipo: 'B', item: 'basurero' },
  hermes:    { c: 23, r: 5, tipo: 'J', item: 'trofeo' },
};
for (const id in PUESTOS) {               // asiento (pies del personaje sentado)
  const p = PUESTOS[id], fila = p.tipo === 'A' ? p.r + 1 : p.r - 1;
  p.sc = p.c; p.sr = fila; p.x = (p.c + 1) * TS; p.y = fila * TS + 12;
}
const CAFE = [[22, 10], [24, 10], [26, 10], [20, 11], [22, 13]];   // sitios del rincón del café

/* ---------------- Rejilla caminable ---------------- */
const pasa = MAPA.map(f => [...f].map(ch => '.bdk'.includes(ch)));
function bloquear(c, r, w = 1, h = 1) { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) if (pasa[y]) pasa[y][x] = false; }
for (const id in PUESTOS) bloquear(PUESTOS[id].c, PUESTOS[id].r, 2, 1);
bloquear(0, 2); bloquear(16, 2, 3, 1);            // planta, dispensador, planta
bloquear(20, 2, 2, 1); bloquear(27, 2); bloquear(27, 7); bloquear(20, 5, 1, 2); // librero, plantas, sillón jefe
bloquear(22, 9, 6, 1); bloquear(24, 12, 2, 1); bloquear(27, 13, 1, 2);          // barra, mesa, planta
bloquear(4, 11, 2, 2); bloquear(0, 14); bloquear(9, 10); bloquear(1, 11, 2, 1);                        // mesa reunión, plantas
bloquear(12, 13, 3, 1); bloquear(11, 13); bloquear(15, 13); bloquear(17, 9);      // sofá, plantas
function ruta(c0, r0, c1, r1) {            // BFS 4 direcciones -> lista de baldosas
  const key = (c, r) => r * COLS + c, prev = new Map([[key(c0, r0), -1]]), q = [[c0, r0]];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === c1 && r === r1) break;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(key(nc, nr))) continue;
      if (!pasa[nr][nc] && !(nc === c1 && nr === r1)) continue;
      prev.set(key(nc, nr), key(c, r)); q.push([nc, nr]);
    }
  }
  const out = []; let k = key(c1, r1);
  if (!prev.has(k)) return [];
  while (k !== -1) { out.unshift([k % COLS, Math.floor(k / COLS)]); k = prev.get(k); }
  return out;
}

/* ---------------- Lienzos ---------------- */
const cv = document.getElementById('oficina'), ctx = cv.getContext('2d');
const mundo = document.createElement('canvas'); mundo.width = MW; mundo.height = MH;
const fondo = document.createElement('canvas'); fondo.width = MW; fondo.height = MH;
const gm = mundo.getContext('2d'), gf = fondo.getContext('2d');
let g = gf, esc = 2, dpr = 1;

/* ---------------- Primitivas ---------------- */
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function oscuro(hex, f = 0.78) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + (((n >> 16) * f) | 0) + ',' + ((((n >> 8) & 255) * f) | 0) + ',' + (((n & 255) * f) | 0) + ')';
}
const FONT3 = { J: '001001001101010', E: '111100110100111', F: '111100110100100', C: '011100100100011', A: '010101111101101' };
function pixTexto(t, x, y, c) {           // fuente de 3x5 px
  [...t].forEach((ch, i) => { const b = FONT3[ch]; if (b) for (let k = 0; k < 15; k++) if (b[k] === '1') R(x + i * 4 + (k % 3), y + ((k / 3) | 0), 1, 1, c); });
}

/* ---------------- Mobiliario (parametrizado) ---------------- */
const K = '#2b2230';                       // contorno general
function pisoMadera(x0, y0, w, h) {
  for (let y = y0; y < y0 + h; y += 4) {
    const fila = y >> 2; let x = x0 - Math.floor(hash(fila, 7) * 32);
    while (x < x0 + w) {
      const L = 24 + Math.floor(hash(fila, x) * 4) * 8, v = hash(x, fila);
      const xa = Math.max(x, x0), xb = Math.min(x + L, x0 + w);
      R(xa, y, xb - xa, 3, v < .33 ? '#c8864c' : v < .66 ? '#c07d45' : '#cd8f55');
      R(xa, y + 3, xb - xa, 1, '#9a6034');
      if (x >= x0) R(x, y, 1, 3, '#a1683a');
      if (v > .86) R(xa + 4, y + 1, 2, 1, '#ad713e');
      x += L;
    }
  }
}
function alfombra(x, y, w, h, base, borde, motivo) {
  R(x, y, w, h, borde); R(x + 2, y + 2, w - 4, h - 4, base);
  g.fillStyle = motivo;
  for (let i = x + 5; i < x + w - 5; i += 6) { g.fillRect(i, y + 3, 3, 1); g.fillRect(i, y + h - 4, 3, 1); }
  for (let j = y + 6; j < y + h - 6; j += 6) { g.fillRect(x + 3, j, 1, 3); g.fillRect(x + w - 4, j, 1, 3); }
}
function planta(x, y, alta) {              // x,y = esquina de la baldosa
  const h = alta ? 10 : 0;
  R(x + 3, y + 8, 10, 8, K); R(x + 4, y + 9, 8, 6, '#c0683c'); R(x + 3, y + 8, 10, 2, '#d98250'); R(x + 4, y + 13, 8, 2, '#a3552f');
  const hojas = [[7, -2, 2, 11], [3, 1, 4, 3], [9, 0, 4, 3], [1, 3, 4, 3], [11, 3, 4, 3], [4, -3, 3, 4], [9, -4, 3, 4], [6, -6, 3, 4]];
  for (const [dx, dy, w, hh] of hojas) R(x + dx - 1, y + dy - h - 1, w + 2, hh + 2, '#1f4a2c');
  hojas.forEach(([dx, dy, w, hh], i) => { R(x + dx, y + dy - h, w, hh, i % 2 ? '#4fa35e' : '#62bd6f'); R(x + dx, y + dy - h, 1, 1, '#8fdc8f'); });
  if (alta) R(x + 7, y - 2, 2, 10, '#3e7d47');
}
function librero(x, y, w) {                // alto; baldosa base en y
  R(x, y - 22, w, 37, K); R(x + 1, y - 21, w - 2, 35, '#8a5a34');
  const cols = ['#e5484d', '#f2c14e', '#4fa35e', '#4a9be8', '#c27ae0', '#f07aa0', '#e98a3c'];
  for (let s = 0; s < 3; s++) {
    const sy = y - 19 + s * 11; R(x + 2, sy, w - 4, 9, '#4a2e1c');
    for (let i = 0, bx = x + 3; bx < x + w - 4; i++) { const bw = 2 + (hash(i, s + x) > .6 ? 1 : 0), bh = 6 + ((hash(s, i + x) * 3) | 0);
      R(bx, sy + 9 - bh, bw, bh, cols[(i * 3 + s + x) % cols.length]); bx += bw + 1; }
  }
}
function cuadro(x, y, w, h, tipo) {
  R(x - 1, y - 1, w + 2, h + 2, K); R(x, y, w, h, '#d7a94b'); R(x + 1, y + 1, w - 2, h - 2, '#8fd3ff');
  if (tipo === 'flor') { R(x + 1, y + h - 4, w - 2, 3, '#4fa35e'); R(x + w / 2 - 1, y + 4, 2, h - 7, '#3e7d47'); R(x + w / 2 - 3, y + 2, 6, 4, '#f07aa0'); R(x + w / 2 - 1, y + 3, 2, 2, '#ffd54f'); }
  else { R(x + 1, y + h - 5, w - 2, 4, '#4fa35e'); R(x + 3, y + h - 8, 6, 3, '#62bd6f'); R(x + w - 6, y + 2, 3, 3, '#ffd54f'); }
}
function ventana(x, y, w) {
  R(x - 1, y - 1, w + 2, 18, K); R(x, y, w, 16, '#f5f0e6'); R(x + 1, y + 1, w - 2, 14, '#9fdcff');
  R(x + 1, y + 10, w - 2, 5, '#c7ecff'); R(x + w / 2 - 1, y, 2, 16, '#f5f0e6'); R(x, y + 7, w, 2, '#f5f0e6');
  R(x - 2, y + 16, w + 4, 2, '#d9cbb3');
}
function silla(cx, sy, col, deEspaldas) {   // silla de oficina; sy = pies del personaje
  if (deEspaldas) {                         // respaldo se ve por delante del personaje
    R(cx - 7, sy - 6, 14, 7, K); R(cx - 6, sy - 5, 12, 5, col); R(cx - 6, sy - 5, 12, 1, 'rgba(255,255,255,.25)');
    R(cx - 1, sy, 2, 2, K); R(cx - 5, sy + 2, 10, 1, K);
  } else {
    R(cx - 8, sy - 23, 16, 13, K); R(cx - 7, sy - 22, 14, 11, col); R(cx - 7, sy - 22, 14, 1, 'rgba(255,255,255,.25)');
  }
}
function escritorio(x, y, w, jefe) {        // x,y = baldosa; tablero + frente en 3/4
  const top = jefe ? '#7a4a2c' : '#c98f58', luz = jefe ? '#93603a' : '#dcaa74', fr = jefe ? '#4f2f1c' : '#8f5a33';

  const firma = panelId + JSON.stringify(todos); if (firma === ultimoPintado) return; ultimoPintado = firma;
  const abajo = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 40;
  caja.innerHTML = todos.length ? todos.map(m => `<div class="msg ${m.mio ? 'mio' : 'otro'}"><span class="meta">${escHTML(m.mio ? 'Tú (JASMEE)' : m.de)} · ${escHTML(verTs(m.ts))}</span>${escHTML(m.texto)}</div>`).join('')
    : '<div class="vacio">Aún no hay mensajes.<br>Escribe una orden abajo y pulsa «Enviar».</div>';
  if (abajo || !caja.dataset.listo) { caja.scrollTop = caja.scrollHeight; caja.dataset.listo = '1'; }
}
function openAgentPanel(agentId) {
  const a = AGENTES.find(x => x.id === agentId); if (!a) return;
  panelId = agentId; ultimoPintado = '';
  panelCaja.innerHTML = `<button type="button" class="x" id="cerrarPanel" aria-label="Cerrar" title="Cerrar">×</button>
    <h2 id="pNombre"></h2><div class="rol" id="pRol"></div>
    <div class="fila"><span class="et">Estado:</span> <b id="pEstado"></b> <small id="pTs"></small></div>
    <div class="fila"><span class="et">Tarea:</span> <span id="pTarea"></span></div>
    <div class="msgs" id="pMsgs" aria-live="polite"></div>
    <div class="envio">
      <textarea id="pTexto" rows="2" maxlength="2000" placeholder="${agentId === 'hermes' ? 'Escribe un mensaje para HERMES…' : 'Escribe una orden para ' + escHTML(corto(a.nombre)) + '…'}"></textarea>
      <button type="button" class="btn" id="pEnviar">Enviar</button>
    </div>
    <div class="clave" id="pClaveZona">
      <input type="password" id="pClave" placeholder="Clave de la oficina" autocomplete="current-password" aria-label="Clave de la oficina">
      <label><input type="checkbox" id="pRecordar"> recordar clave en este equipo</label>
    </div>
    <div class="clave" id="pClaveOk" hidden>🔒 Clave guardada en este equipo · <a href="#" id="pOlvidar">olvidar clave</a></div>
    <div class="aviso" id="pAviso"></div>`;
  panel.hidden = false;
  pintarInfo(); pintarClave(); pintarMensajes();
  $p('cerrarPanel').onclick = cerrarPanel;
  $p('pEnviar').onclick = enviarOrden;
  $p('pTexto').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarOrden(); } });
  $p('pClave').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enviarOrden(); } });
  $p('pOlvidar').onclick = e => { e.preventDefault(); lsSet(LS_CLAVE, null); webhookCache = null; pintarClave(); aviso('Clave olvidada en este equipo.'); };
  if (matchMedia('(pointer:fine)').matches) $p('pTexto').focus();
}
function cerrarPanel() { panel.hidden = true; panelId = null; }
let enviando = false;
async function enviarOrden() {
  if (enviando || !panelId) return;
  const id = panelId, a = AGENTES.find(x => x.id === id), texto = $p('pTexto').value.trim();
  if (!texto) { aviso('Escribe una orden primero.', true); $p('pTexto').focus(); return; }
  const guardada = lsGet(LS_CLAVE), clave = guardada || $p('pClave').value;
  if (!clave) { aviso('Escribe la clave de la oficina para poder enviar.', true); $p('pClave').focus(); return; }
  enviando = true; $p('pEnviar').disabled = true; aviso('Enviando…');
  try {
    let url;
    try { url = await obtenerWebhook(clave); }
    catch (e) {
      if (e.message === 'sin-config') aviso('El envío aún no está configurado (falta el webhook cifrado).', true);
      else if (e.message === 'sin-crypto') aviso('Este navegador no permite cifrado; abre la página con https.', true);
      else {
        aviso('Clave incorrecta', true);
        if (guardada) { lsSet(LS_CLAVE, null); pintarClave(); }
        const c = $p('pClave'); c.value = ''; c.focus();
      }
      return;
    }
    if (!guardada && $p('pRecordar').checked) { lsSet(LS_CLAVE, clave); pintarClave(); }
    const msg = id === 'hermes' ? `[OFICINA] Para HERMES — de JASMEE: ${texto}`
                                : `[OFICINA] ${a.nombre} (${id}) — orden de JASMEE: ${texto}`;
    try {
      // Petición "simple" (form-urlencoded, sin preflight). Slack no manda cabeceras CORS, por eso
      // usamos mode:'no-cors': llega igual, pero el navegador no deja leer la respuesta.
      await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'payload=' + encodeURIComponent(JSON.stringify({ text: msg })) });
    } catch (e) { aviso('No se pudo enviar. Revisa tu conexión a internet e inténtalo otra vez.', true); return; }
    const lista = leerChat(id); lista.push({ de: 'JASMEE', texto, ts: new Date().toISOString() });
    lsSet(lsChat(id), JSON.stringify(lista.slice(-200)));
    $p('pTexto').value = ''; $p('pClave').value = '';
    pintarMensajes(); aviso('✓ Orden enviada. La respuesta aparecerá aquí.');
  } finally { enviando = false; const b = $p('pEnviar'); if (b) b.disabled = false; }
}
panel.addEventListener('click', e => { if (e.target === panel) cerrarPanel(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) cerrarPanel(); });
document.getElementById('equipo').addEventListener('click', e => { const d = e.target.closest('.ag'); if (d) openAgentPanel(d.dataset.id); });

/* ---------------- Reloj (hora de Lima) y resumen ---------------- */
const fmtHora = new Intl.DateTimeFormat('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const fmtFecha = new Intl.DateTimeFormat('es-PE', { timeZone: 'America/Lima', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function tic() {
  const ahora = new Date();
  const partes = Object.fromEntries(fmtHora.formatToParts(ahora).map(p => [p.type, p.value]));
  horaLima = { h: +partes.hour % 24, m: +partes.minute, s: +partes.second };
  document.getElementById('hora').textContent = `${String(horaLima.h).padStart(2, '0')}:${partes.minute}:${partes.second}`;
  document.getElementById('fecha').textContent = 'Lima · ' + cap(fmtFecha.format(ahora));
}
function resumen() {
  const c = { trabajando: 0, libre: 0, bloqueado: 0 };
  AGENTES.forEach(a => { if (c[a.estado] !== undefined) c[a.estado]++; });
  document.getElementById('resumen').textContent =
    `${c.trabajando} trabajando · ${c.libre} libre${c.libre === 1 ? '' : 's'} · ${c.bloqueado} bloqueado${c.bloqueado === 1 ? '' : 's'}`;
  document.getElementById('equipo').innerHTML = AGENTES.map(a => {
    const e = ESTADOS[a.estado] || ESTADOS.libre;
    return `<div class="ag" data-id="${escHTML(a.id)}"><b><span class="dot" style="background:${e.color}"></span>${escHTML(corto(a.nombre))}</b><small>${e.txt} · ${escHTML(cap(a.tarea) || a.rol)}</small></div>`;
  }).join('');
}

/* ---------------- API para actualizar en vivo ---------------- */
function actualizar(id, estado, tarea, ts) {
  const a = AGENTES.find(x => x.id === id); if (!a) return false;
  if (estado && ESTADOS[estado]) a.estado = estado;
  if (tarea !== undefined && tarea !== null) a.tarea = String(tarea);   // texto del globito de tarea
  if (ts) a.ts = ts;
  resumen(); if (panelId === id) pintarInfo(); return true;
}
window.oficina = { actualizar, agentes: AGENTES };
window.openAgentPanel = openAgentPanel;
// Si la página se sirve por http(s), lee "estado.json" (junto a este archivo) cada 20 s.
// Formato: [{ "id": "ali", "estado": "trabajando", "tarea": "...", "ts": "2026-10-05T23:40:00-05:00" }, ...]
// Lo escriben los agentes con set-estado.sh y lo publica push-estado.sh.
const POLL_MS = 20000;
let firmaEstado = '';
async function cargarEstadoExterno() {
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('estado.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const txt = await r.text(); if (txt === firmaEstado) return; firmaEstado = txt;
    const d = JSON.parse(txt);
    (Array.isArray(d) ? d : (d.agentes || [])).forEach(x => x && actualizar(x.id, x.estado, x.tarea, x.ts));
  } catch (e) { /* sin estado.json: se usan los datos de arriba */ }
}
// Respuestas de HERMES/agentes para el chat: "respuestas.json" = [{ "id", "de", "texto", "ts" }]
async function cargarRespuestas() {
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('respuestas.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const d = await r.json(); if (!Array.isArray(d)) return;
    respuestas = d; if (panelId) pintarMensajes();
  } catch (e) { /* sin respuestas.json: no se muestra nada */ }
}

addEventListener('resize', ajustar);
dibujarFondo(); tic(); resumen(); ajustar(); cargarEstadoExterno(); cargarRespuestas();
setInterval(tic, 1000); setInterval(cargarEstadoExterno, POLL_MS); setInterval(cargarRespuestas, POLL_MS);
requestAnimationFrame(cuadroAnim);
})();
</script>
