    const d = JSON.parse(res.txt); if (!Array.isArray(d)) return;
    if (!res.api && apiReciente() && maxTs(d) < maxTs(respuestas)) return;   // copia de Pages más vieja que la de la API
    respuestas = d; respCargadas = true; revisarPendientes(); if (panelId) pintarMensajes();
  } catch (e) { /* sin respuestas.json: no se muestra nada */ }
}

/* ---------------- Arranque ---------------- */
const POLL3D = 20000;
tic(); resumen(); aplicarLuz(); cargarEstadoExterno(); cargarRespuestas();
setInterval(tic, 1000); setInterval(cargarEstadoExterno, POLL3D); setInterval(cargarRespuestas, POLL3D);
setInterval(() => { revisarBloqueados(); pintarGlobos(); }, 1000);
setInterval(revisarPendientes, 15000);
for (const id in pendientes) if (pendientes[id] && pendientes[id].desde) activarRapido(pendientes[id].desde);
cargarDatosDia(); setInterval(cargarDatosDia, POLL3D);
cargarEventos(); setInterval(cargarEventos, POLL3D);
document.getElementById('cargando').remove();
</script>
