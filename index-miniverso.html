  for (let i = 0; i < N_POLVO; i++) { const d = POLVO[i]; pp[i * 3] = d.x + Math.sin(t * 0.13 + d.f) * 0.6; pp[i * 3 + 1] = d.y + Math.sin(t * 0.21 + d.f * 2) * 0.35; pp[i * 3 + 2] = d.z + Math.cos(t * 0.11 + d.f) * 0.6; pv[i] = 0.35 + Math.sin(t * 0.8 + d.f * 3) * 0.3; }
  polvo.geometry.attributes.position.needsUpdate = polvo.geometry.attributes.aVida.needsUpdate = true;
  // impresora
  if (!impresora.activo && t > impresora.prox) { impresora.activo = true; impresora.t0 = t; hoja.visible = true; try { if (sonido.on && sonido.ctx && sonido.ctx.state === 'running' && !document.hidden && volPos) { const c = sonido.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = 70; g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(0.012 * volPos((IMP.x + COLS / 2) * 16, (IMP.z + ROWS / 2) * 16), c.currentTime + 0.1); g.gain.linearRampToValueAtTime(0, c.currentTime + 2.2); o.connect(g).connect(sonido.master); o.start(); o.stop(c.currentTime + 2.3); } } catch (e) { } }
  if (impresora.activo) { const k = (t - impresora.t0) / 2.6; ledImp.material.color.set(Math.sin(t * 14) > 0 ? '#7be3a4' : '#1f6a3f');
    hoja.position.set(IMP.x - 0.08 - Math.min(1, k) * 0.24, 0.98 - Math.min(1, k) * 0.18 + impresora.pila * 0.004, IMP.z); hoja.rotation.z = -0.5 * (1 - Math.min(1, k));
    if (k > 1.6) { impresora.activo = false; impresora.pila = (impresora.pila + 1) % 6; ledImp.material.color.set('#3bb273'); impresora.prox = t + 35 + rndV() * 55; } }
  // pasantes del pasillo
  if (!PASANTES.some(p => p.activo) && t > pasillo.prox) { const P = PASANTES[pasillo.i++ % 2]; P.activo = true; P.dir = rndV() < 0.5 ? 1 : -1; P.x = -P.dir * 20.4; P.pausa = 0; P.sigPausa = 4 + rndV() * 5; P.per.g.visible = true; }
  for (const P of PASANTES) {
    if (!P.activo) continue; const per = P.per;
    if (P.nom === 'limpieza' && P.pausa <= 0 && (P.sigPausa -= dt) < 0) { P.pausa = 2.5 + rndV() * 2; P.sigPausa = 6 + rndV() * 6; }
    const andando = P.pausa <= 0; if (!andando) P.pausa -= dt; else P.x += P.dir * P.vel * dt;
    per.g.position.set(P.x, 0, Z(13) + 0.62); per.g.rotation.y = P.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    const s = andando ? Math.sin(t * (P.vel * 5.5)) : 0; per.piernas[0].rotation.x = s * 0.55; per.piernas[1].rotation.x = -s * 0.55;
    per.cad.position.y = 0.75 + Math.abs(s) * 0.03;
    if (P.nom === 'mensajero') { per.brazos[0].rotation.x = per.brazos[1].rotation.x = 1.15; }
    else if (andando) { per.brazos[0].rotation.x = 0.9; per.brazos[1].rotation.x = 0.9; }
    else { per.brazos[0].rotation.x = 0.7 + Math.sin(t * 5) * 0.35; per.brazos[1].rotation.x = 0.7 - Math.sin(t * 5) * 0.35; }   // trapea
    postura(per, t);
    if (Math.abs(P.x) > 20.6) { P.activo = false; per.g.visible = false; pasillo.prox = t + 45 + rndV() * 70; }
  }
}

};
